name: Publish MCP tool

on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version
        required: true
        default: 1.1.0
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Publish HUp.NET.Mcp
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Validate version
        shell: pwsh
        run: |
          if ('${{ inputs.version }}' -notmatch '^\d+\.\d+\.\d+([-.][0-9A-Za-z.-]+)?$') {
            throw 'version must be a valid semantic version.'
          }

      - name: Build
        run: dotnet build Up.NET.slnx --configuration Release

      - name: Pack global tool
        run: >-
          dotnet pack Up.NET.Mcp/Up.NET.Mcp.csproj
          --configuration Release
          --no-build
          --output artifacts
          -p:Version=${{ inputs.version }}

      - name: Log in to NuGet.org with OIDC
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish global tool
        run: >-
          dotnet nuget push
          artifacts/HUp.NET.Mcp.${{ inputs.version }}.nupkg
          --source https://api.nuget.org/v3/index.json
          --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          --skip-duplicate
